services:
  iconttv-discord-web:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: iconttv-discord-web
    command: dist/web.js
    user: 1000:1000
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - WEB_PORT=${WEB_PORT:-3011}
    ports:
      - '${WEB_PORT:-3011}:${WEB_PORT:-3011}'
    volumes:
      - ./logs/web:/app/logs
    restart: unless-stopped

  iconttv-discord-hook:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: iconttv-discord-hook
    shm_size: '2g'
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    command: dist/index.js
    user: 1000:1000
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
  
  iconttv-discord-hook-archive:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: iconttv-discord-hook-archive
    shm_size: '1g'
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512m
    command: dist/archive.js
    user: 1000:1000
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"
    volumes:
      - ./logs/archive:/app/logs
    restart: unless-stopped
